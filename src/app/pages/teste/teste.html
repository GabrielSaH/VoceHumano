<div class="mx-auto max-w-3xl px-4 py-10 sm:px-6 sm:py-14">
  @switch (etapa()) {
    @case ('intro') {
      <app-teste-intro
        [estadoDilemas]="estadoDilemas()"
        (iniciar)="iniciar()"
        (recarregar)="dilemas.reload()"
      />
    }
    @case ('questoes') {
      <div class="mb-3 flex items-baseline justify-between text-[0.65rem] uppercase tracking-[0.3em] text-lab-600">
        <span>Dilema {{ (indice() + 1).toString().padStart(2, '0') }} / {{ questoes().length }}</span>
        <span class="flex items-center gap-2">
          <span class="size-1.5 animate-pulse bg-rust-600" aria-hidden="true"></span>
          Registrando
        </span>
      </div>
      <app-progresso [total]="questoes().length" [atual]="indice()" />

      <!-- track por id recria a questão a cada dilema, zerando a seleção -->
      @for (dilema of [atual()]; track dilema.id) {
        <app-questao class="mt-10 block" [dilema]="dilema" (respondida)="responder($event)" />
      }
    }
    @case ('concluido') {
      @if (resultado(); as resultado) {
        <app-teste-conclusao [resultado]="resultado" (refazer)="iniciar()" />
      }
    }
  }
</div>
